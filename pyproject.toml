[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcpm2-arabic-dialects-turbo"
version = "0.1.0"
description = "Low-latency VoxCPM2 inference for Arabic dialect LoRA adapters with voice cloning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "torch>=2.5.0,!=2.6.*",
    "triton>=3.0.0",
    "flash_attn",
    "transformers>=4.51.0",
    "safetensors",
    "huggingface_hub",
    "xxhash",
    "numpy",
    "librosa",
    "soundfile>=0.13.1",
    "pydantic",
]

[project.optional-dependencies]
# the OpenAI-compatible HTTP server (nanovllm_voxcpm.entrypoints.openai_server) and the WebSocket one (ws_server)
server = ["fastapi", "uvicorn", "python-multipart", "websockets>=13", "soxr", "uvloop", "httptools"]
# the tests: python -m pytest tests
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["nanovllm_voxcpm*", "voxcpm_kernels*"]

[tool.setuptools.package-data]
# CUDA sources compiled on first use, VoxCPM2's SmoothQuant calibration for the int8 layers
voxcpm_kernels = ["cuda/*.cu", "smooth_stats.pt"]
